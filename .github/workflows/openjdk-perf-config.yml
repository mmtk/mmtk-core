name: OpenJDK Perf Config (reusable)

# Single source of truth for RESULT_REPO_BRANCH/DEPLOY/CI_PERF_KIT_VERSION
# and other run-scoped values for OpenJDK, shared by the per-commit and weekly-batch
# workflows via `needs: [config]` / `needs.config.outputs.<name>` (this
# works in a reusable workflow's `with:` block, unlike `env`).
#
# To test in a branch: set RESULT_REPO_BRANCH/DEPLOY below to test values,
# and uncomment the pull_request trigger in the workflow you're testing.

on:
  workflow_call:
    outputs:
      result_repo_branch:
        value: ${{ jobs.config.outputs.result_repo_branch }}
      deploy:
        value: ${{ jobs.config.outputs.deploy }}
      ci_perf_kit_version:
        value: ${{ jobs.config.outputs.ci_perf_kit_version }}
      openjdk_rev:
        value: ${{ jobs.config.outputs.openjdk_rev }}
      normal_heap_factor:
        value: ${{ jobs.config.outputs.normal_heap_factor }}
      large_heap_factor:
        value: ${{ jobs.config.outputs.large_heap_factor }}

jobs:
  config:
    # Trivial - no need to occupy the dedicated perf runner for this.
    runs-on: ubuntu-latest
    env:
      # The branch to save run data and plot graph from. Use 'self-hosted-chopin'
      # for master. Use 'chopin-test' or anything else for testing in a branch.
      RESULT_REPO_BRANCH: 'self-hosted-chopin'
      # Whether we deploy the generated page. Set to true for master.
      DEPLOY: true
      CI_PERF_KIT_VERSION: '0.9.4'
      # heap_modifier passed to run_benchmarks: a multiple of each benchmark's
      # min heap size. NoGC doesn't use either of these (it sets heap_modifier
      # to 0, meaning "use the max heap instead").
      NORMAL_HEAP_FACTOR: '2.5'
      LARGE_HEAP_FACTOR: '5'
    outputs:
      result_repo_branch: ${{ steps.vars.outputs.result_repo_branch }}
      deploy: ${{ steps.vars.outputs.deploy }}
      ci_perf_kit_version: ${{ steps.vars.outputs.ci_perf_kit_version }}
      openjdk_rev: ${{ steps.openjdk-rev.outputs.rev }}
      normal_heap_factor: ${{ steps.vars.outputs.normal_heap_factor }}
      large_heap_factor: ${{ steps.vars.outputs.large_heap_factor }}
    steps:
      - id: vars
        run: |
          echo "result_repo_branch=$RESULT_REPO_BRANCH" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "ci_perf_kit_version=$CI_PERF_KIT_VERSION" >> "$GITHUB_OUTPUT"
          echo "normal_heap_factor=$NORMAL_HEAP_FACTOR" >> "$GITHUB_OUTPUT"
          echo "large_heap_factor=$LARGE_HEAP_FACTOR" >> "$GITHUB_OUTPUT"
      # Only used to label the result-repo commit message; the binding isn't
      # built here, so this is a plain (cheap) checkout, no ci-checkout.sh.
      - name: Checkout OpenJDK Binding
        uses: actions/checkout@v4
        with:
          repository: mmtk/mmtk-openjdk
          ref: jdk-21
          path: mmtk-openjdk
      - id: openjdk-rev
        run: echo "rev=$(git -C mmtk-openjdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"
