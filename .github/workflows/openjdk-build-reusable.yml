name: OpenJDK Build (reusable)

# Builds OpenJDK+MMTk and caches it, keyed by build_path + the mmtk-core +
# mmtk-openjdk commits, for openjdk-run-plan-reusable.yml /
# openjdk-compare-run-plan-reusable.yml to restore within the same workflow
# run. mmtk_core_repo/ref and openjdk_binding_repo/ref default to "whatever
# triggered this run" and "mmtk/mmtk-openjdk@jdk-21" (perf-regression-ci-openjdk's
# per-commit case); callers comparing two arbitrary refs (e.g.
# perf-compare-ci.yml) set them explicitly and give each side its own
# build_path so both builds can coexist under the same ci-perf-kit/build/.
on:
  workflow_call:
    inputs:
      ci_perf_kit_version:
        required: true
        type: string
      openjdk_rev:
        description: mmtk-openjdk revision being built; used with mmtk_core_ref (or github.sha) in the cache key.
        required: true
        type: string
      mmtk_core_repo:
        description: mmtk-core repo to check out, as {owner}/{repo}. Defaults to this workflow's own repo (i.e. whatever triggered this run) - set explicitly for a build that isn't of the triggering commit (e.g. one side of a PR comparison).
        required: false
        type: string
        default: ''
      mmtk_core_ref:
        description: mmtk-core ref/sha to check out. Defaults to github.sha. Also used (in place of github.sha) as the mmtk-core half of the cache key, so it must be a specific commit, not a branch name, whenever it's set explicitly.
        required: false
        type: string
        default: ''
      openjdk_binding_repo:
        description: mmtk-openjdk repo to check out, as {owner}/{repo}.
        required: false
        type: string
        default: 'mmtk/mmtk-openjdk'
      openjdk_binding_ref:
        description: mmtk-openjdk ref/sha to check out.
        required: false
        type: string
        default: 'jdk-21'
      build_path:
        description: Name of the build dir under ci-perf-kit/build (and .../upload) this build is left at, and the cache is scoped to. Defaults to 'jdk-mmtk' - the name openjdk-run-plan-reusable.yml expects. Callers building more than one thing in the same workflow run (e.g. a trunk/branch pair) must pass distinct names.
        required: false
        type: string
        default: 'jdk-mmtk'

env:
  # Directory in ci-perf-kit that will be uploaded as an artifact. Can be found in ci-perf-kit/scripts/common.sh
  CI_PERF_KIT_BUILD: ci-perf-kit/upload
  # Kept in sync with the same env var in openjdk-run-plan-reusable.yml.
  OPENJDK_BUILD_CACHE_PREFIX: openjdk-mmtk-build-

jobs:
  openjdk-build:
    runs-on: [self-hosted, Linux, freq-scaling-off]
    timeout-minutes: 1440
    steps:
      # check whether a build for this commit is already cached, before
      # doing any of the expensive checkout/build work below
      - name: Check OpenJDK+MMTk build cache
        id: check-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ci-perf-kit/build/${{ inputs.build_path }}
            ci-perf-kit/probes/out
            ci-perf-kit/openjdk-probe
          key: ${{ env.OPENJDK_BUILD_CACHE_PREFIX }}${{ inputs.build_path }}-${{ inputs.mmtk_core_ref || github.sha }}-${{ inputs.openjdk_rev }}
          lookup-only: true
      # checkout perf-kit
      - name: Checkout Perf Kit
        uses: actions/checkout@v4
        with:
          repository: mmtk/ci-perf-kit
          ref: ${{ inputs.ci_perf_kit_version }}
          path: ci-perf-kit
          submodules: true
      - name: Checkout MMTk Core
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mmtk_core_repo || github.repository }}
          ref: ${{ inputs.mmtk_core_ref || github.sha }}
          path: mmtk-core
      - name: Checkout OpenJDK Binding
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.openjdk_binding_repo }}
          ref: ${{ inputs.openjdk_binding_ref }}
          path: mmtk-openjdk
      - name: Checkout OpenJDK
        if: steps.check-cache.outputs.cache-hit != 'true'
        working-directory: mmtk-openjdk
        run: |
          ./.github/scripts/ci-checkout.sh
      - name: Setup Rust Toolchain
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: echo "RUSTUP_TOOLCHAIN=`cat mmtk-core/rust-toolchain`" >> $GITHUB_ENV
      # setup
      - name: Replace mmtk-core dependency and clean previous build
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          # Note that ci-replace-mmtk-dep.sh will apply `realpath()` to the `--mmtk-core-path` option.
          # so we specify the relative path from the PWD to the mmtk-core repo.
          ./mmtk-core/.github/scripts/ci-replace-mmtk-dep.sh mmtk-openjdk/mmtk/Cargo.toml \
            --mmtk-core-path mmtk-core
          rm -rf mmtk-openjdk/repos/openjdk/scratch
          rm -rf mmtk-openjdk/repos/openjdk/build
      # build
      - name: Build OpenJDK+MMTk
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64/
          ./ci-perf-kit/scripts/openjdk-build.sh ./mmtk-openjdk ./mmtk-core ${{ inputs.build_path }}
      # cache the build for openjdk-run-plan-reusable.yml / openjdk-compare-run-plan-reusable.yml callers
      - name: Cache OpenJDK+MMTk build
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ci-perf-kit/build/${{ inputs.build_path }}
            ci-perf-kit/probes/out
            ci-perf-kit/openjdk-probe
          key: ${{ env.OPENJDK_BUILD_CACHE_PREFIX }}${{ inputs.build_path }}-${{ inputs.mmtk_core_ref || github.sha }}-${{ inputs.openjdk_rev }}
      - name: Upload build as artifacts
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openjdk-build-${{ inputs.build_path }}
          path: ${{ env.CI_PERF_KIT_BUILD }}
          if-no-files-found: error
