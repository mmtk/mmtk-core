name: Performance Regression CI (OpenJDK, per-commit)

# Triggerred when a new commit is pushed to master
on:
  push:
    branches:
      - master
  # See openjdk-perf-config.yml for the "testing in a branch" convention -
  # its env: block is what you toggle, not one here.
  # TESTING: enabled to validate the Chopin workflow changes. Revert this before merging.
  pull_request:
    branches:
      - master

env:
  # Directories in ci-perf-kit that will be uploaded as artifacts. The dirs can be found in ci-perf-kit/scripts/common.sh
  CI_PERF_KIT_BUILD: ci-perf-kit/upload
  CI_PERF_KIT_LOG: ci-perf-kit/logs-ng

jobs:
  # Single source of truth for RESULT_REPO_BRANCH/DEPLOY/CI_PERF_KIT_VERSION,
  # shared with the weekly batch workflows. See openjdk-perf-config.yml.
  config:
    uses: ./.github/workflows/openjdk-perf-config.yml

  # Build OpenJDK+MMTk once per push, and cache it for openjdk-run-plan below
  # (and for the weekly batch workflows, which also call this and so will
  # build fresh themselves if that cache is ever missing - e.g. expired).
  openjdk-build:
    needs: [config]
    uses: ./.github/workflows/openjdk-build-reusable.yml
    with:
      ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}

  # Plans we track on every commit: one job per plan, each calling the reusable workflow.
  openjdk-run-plan:
    needs: [config, openjdk-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - plan_name: stickyimmix
            config: running-openjdk-stickyimmix-complete.yml
            heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
          # PLACEHOLDER: LXR isn't merged into mmtk-core yet. Uncomment once
          # it lands and its running-ng config exists in ci-perf-kit.
          # - plan_name: lxr
          #   config: running-openjdk-lxr-complete.yml
          #   heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
    uses: ./.github/workflows/openjdk-run-plan-reusable.yml
    with:
      plan_name: ${{ matrix.plan_name }}
      config: ${{ matrix.config }}
      heap_modifier: ${{ matrix.heap_modifier }}
      result_repo_branch: ${{ needs.config.outputs.result_repo_branch }}
      deploy: ${{ needs.config.outputs.deploy == 'true' }}
      ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}
      openjdk_rev: ${{ needs.config.outputs.openjdk_rev }}
    secrets: inherit

  openjdk-mutator-perf:
    # TEMPORARILY DISABLED while testing the OpenJDK Chopin workflow changes -
    # not part of what's being tested. Revert this before merging.
    if: false
    needs: [config]
    runs-on: [self-hosted, Linux, freq-scaling-off]
    timeout-minutes: 1440
    steps:
      - name: Checkout MMTk Core
        uses: actions/checkout@v4
        with:
          path: mmtk-core
      - name: Checkout OpenJDK Binding
        uses: actions/checkout@v4
        with:
          repository: mmtk/mmtk-openjdk
          ref: jdk-21
          path: mmtk-openjdk
      - name: Checkout OpenJDK
        working-directory: mmtk-openjdk
        run: |
          ./.github/scripts/ci-checkout.sh
      # checkout perf-kit
      - name: Checkout Perf Kit
        uses: actions/checkout@v4
        with:
          repository: mmtk/ci-perf-kit
          ref: ${{ needs.config.outputs.ci_perf_kit_version }}
          path: ci-perf-kit
          token: ${{ secrets.CI_ACCESS_TOKEN }}
          submodules: true
      # setup
      - name: Overwrite MMTk core in openjdk binding
        run: cp -r mmtk-core mmtk-openjdk/repos/
      - name: Setup Rust Toolchain
        run: echo "RUSTUP_TOOLCHAIN=`cat mmtk-core/rust-toolchain`" >> $GITHUB_ENV
      # cleanup previosu build
      - name: Cleanup previous build
        run: |
          rm -rf mmtk-openjdk/repos/openjdk/scratch
          rm -rf mmtk-openjdk/repos/openjdk/build
      - id: branch
        # we cannot use env vars in action input (the deploy step). So put the env var to this step's outputs.
        run: echo "branch_name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')" >> $GITHUB_OUTPUT
      - name: Setup
        run: |
          ./ci-perf-kit/scripts/history-run-setup.sh
          sed -i 's/^mmtk[[:space:]]=/#ci:mmtk=/g' mmtk-openjdk/mmtk/Cargo.toml
          sed -i 's/^#[[:space:]]mmtk/mmtk/g' mmtk-openjdk/mmtk/Cargo.toml
      # run
      - name: Performance Run
        run: |
          export RESULT_REPO=mmtk/ci-perf-result
          export RESULT_REPO_BRANCH=${{ needs.config.outputs.result_repo_branch }}
          export RESULT_REPO_ACCESS_TOKEN=${{ secrets.CI_ACCESS_TOKEN }}
          export FROM_DATE=2020-08-03
          export JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64/
          ./ci-perf-kit/scripts/mutator-history-run.sh ./mmtk-openjdk ./reports/${{ steps.branch.outputs.branch_name }}
      # deploy
      - name: Deploy to Github Page
        if: ${{ needs.config.outputs.deploy == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CI_ACCESS_TOKEN }}
          external_repository: mmtk/ci-perf-result
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true
      - name: Upload build as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutator-regression-build
          path: ${{ env.CI_PERF_KIT_BUILD }}
          if-no-files-found: error
      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutator-regression-logs
          path: ${{ env.CI_PERF_KIT_LOG }}
          if-no-files-found: error
