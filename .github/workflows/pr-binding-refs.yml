# This workflow is used to figure out binding pull requests related with
# the given MMTk core pull request.
#
# To make sure that our maintained bindings always work with the latest MMTk core,
# we may run binding tests for a core PR. By default, we run with the master of
# each binding repo in our mmtk organisation. However, if the core PR has changes
# that requires bindings to update, we can no longer run with the master of the binding repos.
# In such a case, we need to specify the binding PRs so our mmtk-core CI knows how to run the
# correct version of the bindings for the tests.
#
# In the cases that we need to update bindings, we expect the core PR to have a comment like the following
# to specify the binding pull requests. Note if any of the following values are omitted, the default values
# will be used. For most bindings, the default is the master branch in mmtk's binding repos.
# For Julia, the default is JuliaLang/julia master because the MMTk binding is in the Julia repo.
# Repo is in the format of user/repo. Ref could be sha or branch name, but a branch name is only
# accepted for repos in the mmtk organisation, and for repos owned by a public member of it. For
# any other repo the ref has to be a full 40-character commit hash, because a branch can be
# pointed at a different commit after CI has already checked it. If you are an mmtk member and
# your fork is rejected, either pin a commit hash or make your organisation membership public.
#
# Note that OpenJDK 11 and OpenJDK 21 are considered two bindings, and their repo and ref names are
# specified separately.  It is allowed to specify one or both of OpenJDK 11 and 21.
#
# ```
# binding-refs
# OPENJDK11_BINDING_REPO=xx/xx
# OPENJDK11_BINDING_REF=xxxxxx
# OPENJDK21_BINDING_REPO=xx/xx
# OPENJDK21_BINDING_REF=xxxxxx
# JIKESRVM_BINDING_REPO=xx/xx
# JIKESRVM_BINDING_REF=xxxxxx
# V8_BINDING_REPO=xx/xx
# V8_BINDING_REF=xxxxxx
# JULIA_REPO=xx/xx
# JULIA_REF=xxxxxx
# RUBY_BINDING_REPO=xx/xx
# RUBY_BINDING_REF=xxxxxx
# ```

name: Fetch Binding PR Info

on:
  workflow_call:
    inputs:
      pull_request:
        type: string
        required: true
      # Auto-merge pushes a commit onto the binding PR's branch, so it cannot do anything with a
      # ref that is pinned to a commit: there is no branch to update.  Callers that go on to push
      # set this, which turns a pinned ref into an error here rather than a failure later on.
      require_branch_ref:
        type: boolean
        required: false
        default: false
    outputs:
      openjdk11_binding_repo:
        description: "The repository of OpenJDK 11 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.openjdk11_binding_repo}}
      openjdk11_binding_repo_default:
        description: "The default repository of OpenJDK 11 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.openjdk11_binding_repo_default }}
      openjdk11_binding_ref:
        description: "The git ref of OpenJDK 11 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.openjdk11_binding_ref}}
      openjdk11_binding_ref_default:
        description: "The default git ref of OpenJDK 11 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.openjdk11_binding_ref_default }}

      openjdk21_binding_repo:
        description: "The repository of OpenJDK 21 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.openjdk21_binding_repo}}
      openjdk21_binding_repo_default:
        description: "The default repository of OpenJDK 21 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.openjdk21_binding_repo_default }}
      openjdk21_binding_ref:
        description: "The git ref of OpenJDK 21 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.openjdk21_binding_ref}}
      openjdk21_binding_ref_default:
        description: "The default git ref of OpenJDK 21 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.openjdk21_binding_ref_default }}

      jikesrvm_binding_repo:
        description: "The repository of JikesRVM binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.jikesrvm_binding_repo}}
      jikesrvm_binding_repo_default:
        description: "The default repository of JikesRVM binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.jikesrvm_binding_repo_default }}
      jikesrvm_binding_ref:
        description: "The git ref of JikesRVM binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.jikesrvm_binding_ref}}
      jikesrvm_binding_ref_default:
        description: "The default git ref of JikesRVM binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.jikesrvm_binding_ref_default }}

      v8_binding_repo:
        description: "The repository of V8 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.v8_binding_repo}}
      v8_binding_repo_default:
        description: "The default repository of V8 binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.v8_binding_repo_default }}
      v8_binding_ref:
        description: "The git ref of V8 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.v8_binding_ref}}
      v8_binding_ref_default:
        description: "The default git ref of V8 binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.v8_binding_ref_default }}

      julia_repo:
        description: "The repository of Julia, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.julia_repo }}
      julia_repo_default:
        description: "The default repository of Julia, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.julia_repo_default }}
      julia_ref:
        description: "The git ref of Julia, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.julia_ref }}
      julia_ref_default:
        description: "The default git ref of Julia, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.julia_ref_default }}

      ruby_binding_repo:
        description: "The repository of Ruby binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.ruby_binding_repo}}
      ruby_binding_repo_default:
        description: "The default repository of Ruby binding, such as {user}/{repo}"
        value: ${{ jobs.binding-refs.outputs.ruby_binding_repo_default }}
      ruby_binding_ref:
        description: "The git ref of Ruby binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.ruby_binding_ref}}
      ruby_binding_ref_default:
        description: "The default git ref of Ruby binding, such as sha and branch name"
        value: ${{ jobs.binding-refs.outputs.ruby_binding_ref_default }}

jobs:
  binding-refs:
    runs-on: ubuntu-latest
    env:
      OPENJDK11_BINDING_REPO_DEFAULT: mmtk/mmtk-openjdk
      OPENJDK11_BINDING_REF_DEFAULT: jdk-11
      OPENJDK21_BINDING_REPO_DEFAULT: mmtk/mmtk-openjdk
      OPENJDK21_BINDING_REF_DEFAULT: jdk-21
      JIKESRVM_BINDING_REPO_DEFAULT: mmtk/mmtk-jikesrvm
      JIKESRVM_BINDING_REF_DEFAULT: master
      V8_BINDING_REPO_DEFAULT: mmtk/mmtk-v8
      V8_BINDING_REF_DEFAULT: master
      JULIA_REPO_DEFAULT: JuliaLang/julia
      JULIA_REF_DEFAULT: master
      RUBY_BINDING_REPO_DEFAULT: mmtk/mmtk-ruby
      RUBY_BINDING_REF_DEFAULT: master
    outputs:
        openjdk11_binding_repo: ${{ steps.print.outputs.openjdk11_binding_repo }}
        openjdk11_binding_repo_default: ${{ env.OPENJDK11_BINDING_REPO_DEFAULT }}
        openjdk11_binding_ref: ${{ steps.print.outputs.openjdk11_binding_ref }}
        openjdk11_binding_ref_default: ${{ env.OPENJDK11_BINDING_REF_DEFAULT }}
        openjdk21_binding_repo: ${{ steps.print.outputs.openjdk21_binding_repo }}
        openjdk21_binding_repo_default: ${{ env.OPENJDK21_BINDING_REPO_DEFAULT }}
        openjdk21_binding_ref: ${{ steps.print.outputs.openjdk21_binding_ref }}
        openjdk21_binding_ref_default: ${{ env.OPENJDK21_BINDING_REF_DEFAULT }}
        jikesrvm_binding_repo: ${{ steps.print.outputs.jikesrvm_binding_repo }}
        jikesrvm_binding_repo_default: ${{ env.JIKESRVM_BINDING_REPO_DEFAULT }}
        jikesrvm_binding_ref: ${{ steps.print.outputs.jikesrvm_binding_ref }}
        jikesrvm_binding_ref_default: ${{ env.JIKESRVM_BINDING_REF_DEFAULT }}
        v8_binding_repo: ${{ steps.print.outputs.v8_binding_repo }}
        v8_binding_repo_default: ${{ env.V8_BINDING_REPO_DEFAULT }}
        v8_binding_ref: ${{ steps.print.outputs.v8_binding_ref }}
        v8_binding_ref_default: ${{ env.V8_BINDING_REF_DEFAULT }}
        julia_repo: ${{ steps.print.outputs.julia_repo }}
        julia_repo_default: ${{ env.JULIA_REPO_DEFAULT }}
        julia_ref: ${{ steps.print.outputs.julia_ref }}
        julia_ref_default: ${{ env.JULIA_REF_DEFAULT }}
        ruby_binding_repo: ${{ steps.print.outputs.ruby_binding_repo }}
        ruby_binding_repo_default: ${{ env.RUBY_BINDING_REPO_DEFAULT }}
        ruby_binding_ref: ${{ steps.print.outputs.ruby_binding_ref }}
        ruby_binding_ref_default: ${{ env.RUBY_BINDING_REF_DEFAULT }}
    steps:
        - name: Check binding revisions
          id: parse
          uses: actions/github-script@v7
          env:
            PULL_REQUEST: ${{ inputs.pull_request }}
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              const keys = [
                'OPENJDK11_BINDING', 'OPENJDK21_BINDING', 'JIKESRVM_BINDING',
                'V8_BINDING', 'JULIA', 'RUBY_BINDING'
              ].flatMap(binding => [`${binding}_REPO`, `${binding}_REF`]);
              const bindings = Object.fromEntries(
                keys.map(key => [key, process.env[`${key}_DEFAULT`]])
              );
              const input = process.env.PULL_REQUEST?.trim()
                || String(context.payload.pull_request?.number ?? '');
              const pullNumber = Number(input);
              if (!/^[1-9][0-9]*$/.test(input) || !Number.isSafeInteger(pullNumber)) {
                throw new Error('pull_request must be a positive integer.');
              }
              await github.rest.pulls.get({...context.repo, pull_number: pullNumber});
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullNumber,
                per_page: 100
              });
              const allowedRoles = new Set(['COLLABORATOR', 'MEMBER', 'OWNER']);
              const comment = comments.find(comment =>
                allowedRoles.has(comment.author_association)
                && typeof comment.body === 'string'
                && comment.body.trim().startsWith(context.job)
              );
              if (comment) {
                for (const assignment of comment.body.trim().split(/[\n\r,]/)) {
                  const separator = assignment.indexOf('=');
                  if (separator < 0) continue;
                  const key = assignment.slice(0, separator).trim();
                  if (!Object.hasOwn(bindings, key)) {
                    throw new Error('Comment contains an unsupported binding variable.');
                  }
                  bindings[key] = assignment.slice(separator + 1).trim();
                }
              }
              for (const key of keys) {
                if (typeof bindings[key] !== 'string' || !/^[A-Za-z0-9._/-]+$/.test(bindings[key])) {
                  throw new Error(`${key} must be a nonempty repository/ref value without special characters.`);
                }
              }
              core.setOutput('bindings', JSON.stringify(bindings));
        # Further validate binding revision refs.
        # This is mostly to prevent TOCTOU attacks, where a branch is repointed at a different
        # commit between maintainers checking it and CI using it.
        # Our rules:
        # 1. Trusted repos may use either a branch name or a commit hash as the ref.
        #    ref pointing to a pull request is disallowed. A repo is trusted if:
        #    a. it is in the mmtk organisation, or
        #    b. it is owned by a public member of the mmtk organisation.  Public is the only kind
        #       of membership we can ask about here: 'orgs/{org}/members' answers only for callers
        #       that are themselves org members, and the collaborator endpoint needs push access,
        #       which a pull_request run from a fork never has.  A member who keeps their
        #       membership private therefore falls under rule 2.
        # 2. Untrusted repos must use a full 40-character commit hash, pinning the ref to a fixed
        #    commit.  Whoever comments a hash is responsible for checking that the code at that
        #    commit is not malicious: pinning stops the code changing afterwards, it does not make
        #    the code safe.
        # 3. Repo/ref pairs matching the configured defaults are exempt from the trust checks below.
        # 4. If the caller passes require_branch_ref, a commit hash is rejected outright, even for
        #    a trusted repo.  Such a caller needs a branch it can push to, and a pinned ref would
        #    otherwise only fail once it got as far as the push.
        - name: Validate binding revision refs
          id: print
          shell: bash
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REQUIRE_BRANCH_REF: ${{ inputs.require_branch_ref }}
            OPENJDK11_BINDING_REPO: ${{ fromJSON(steps.parse.outputs.bindings).OPENJDK11_BINDING_REPO }}
            OPENJDK11_BINDING_REF: ${{ fromJSON(steps.parse.outputs.bindings).OPENJDK11_BINDING_REF }}
            OPENJDK21_BINDING_REPO: ${{ fromJSON(steps.parse.outputs.bindings).OPENJDK21_BINDING_REPO }}
            OPENJDK21_BINDING_REF: ${{ fromJSON(steps.parse.outputs.bindings).OPENJDK21_BINDING_REF }}
            JIKESRVM_BINDING_REPO: ${{ fromJSON(steps.parse.outputs.bindings).JIKESRVM_BINDING_REPO }}
            JIKESRVM_BINDING_REF: ${{ fromJSON(steps.parse.outputs.bindings).JIKESRVM_BINDING_REF }}
            V8_BINDING_REPO: ${{ fromJSON(steps.parse.outputs.bindings).V8_BINDING_REPO }}
            V8_BINDING_REF: ${{ fromJSON(steps.parse.outputs.bindings).V8_BINDING_REF }}
            JULIA_REPO: ${{ fromJSON(steps.parse.outputs.bindings).JULIA_REPO }}
            JULIA_REF: ${{ fromJSON(steps.parse.outputs.bindings).JULIA_REF }}
            RUBY_BINDING_REPO: ${{ fromJSON(steps.parse.outputs.bindings).RUBY_BINDING_REPO }}
            RUBY_BINDING_REF: ${{ fromJSON(steps.parse.outputs.bindings).RUBY_BINDING_REF }}
          run: |
            trusted_org=mmtk

            for pair in OPENJDK11_BINDING_REPO:OPENJDK11_BINDING_REF \
                        OPENJDK21_BINDING_REPO:OPENJDK21_BINDING_REF \
                        JIKESRVM_BINDING_REPO:JIKESRVM_BINDING_REF \
                        V8_BINDING_REPO:V8_BINDING_REF \
                        JULIA_REPO:JULIA_REF \
                        RUBY_BINDING_REPO:RUBY_BINDING_REF; do
              repo_var=${pair%:*}
              ref_var=${pair#*:}
              repo_default_var=${repo_var}_DEFAULT
              ref_default_var=${ref_var}_DEFAULT
              repo=${!repo_var}
              ref=${!ref_var}

              is_commit_hash=false
              if [[ $ref =~ ^[0-9a-fA-F]{40}$ ]]; then
                is_commit_hash=true
              else
                case "$ref" in
                  refs/heads/*) branch=${ref#refs/heads/} ;;
                  [rR][eE][fF][sS]/*)
                    echo "::error::$ref_var must be a branch name or a full 40-character commit hash"
                    exit 1
                    ;;
                  *) branch=$ref ;;
                esac
                if ! git check-ref-format --branch "$branch" >/dev/null 2>&1; then
                  echo "::error::$ref_var is not a valid branch name: '$ref'"
                  exit 1
                fi
                # Qualify branches so checkout cannot fall back to tags or pull-request refs.
                printf -v "$ref_var" 'refs/heads/%s' "$branch"
              fi

              # Rule 3: defaults cannot be overwritten by comment keys.
              if [[ $repo == "${!repo_default_var}" && $ref == "${!ref_default_var}" ]]; then
                continue
              fi

              # Rule 4: the caller cannot work with a pinned commit.  Checked before rule 1
              # because it applies to trusted repos as well.
              if [[ $REQUIRE_BRANCH_REF == true && $is_commit_hash == true ]]; then
                echo "::error::$ref_var is pinned to commit '$ref', but this workflow has to push"\
                     "to the binding pull request, so it needs a branch name instead"
                exit 1
              fi

              # Rule 1: a trusted repo may name a branch.
              owner=${repo%%/*}
              if [[ $owner == "$trusted_org" ]]; then
                continue
              fi
              if gh api "orgs/$trusted_org/public_members/$owner" --silent 2>/dev/null; then
                continue
              fi

              # Rule 2: an untrusted repo must name a commit hash.
              if [[ $is_commit_hash == false ]]; then
                echo "::error::'$repo' is not in the $trusted_org organisation and '$owner' is"\
                     "not a public member of it, so $ref_var has to be a full 40-character"\
                     "commit hash rather than '$ref'"
                exit 1
              fi
            done

            printf '%s\n' \
              "openjdk11_binding_repo=$OPENJDK11_BINDING_REPO" \
              "openjdk11_binding_ref=$OPENJDK11_BINDING_REF" \
              "openjdk21_binding_repo=$OPENJDK21_BINDING_REPO" \
              "openjdk21_binding_ref=$OPENJDK21_BINDING_REF" \
              "jikesrvm_binding_repo=$JIKESRVM_BINDING_REPO" \
              "jikesrvm_binding_ref=$JIKESRVM_BINDING_REF" \
              "v8_binding_repo=$V8_BINDING_REPO" \
              "v8_binding_ref=$V8_BINDING_REF" \
              "julia_repo=$JULIA_REPO" \
              "julia_ref=$JULIA_REF" \
              "ruby_binding_repo=$RUBY_BINDING_REPO" \
              "ruby_binding_ref=$RUBY_BINDING_REF" >> "$GITHUB_OUTPUT"
