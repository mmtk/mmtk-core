# This workflow is used to run a benchmark to compare a pull request (specified by the input 'pull_request')
# and the current master, for one runtime and one GC plan per manual run.
# This workflow assumes the pull requests (mmtk-core PRs and the binding PRs are based on
# their corresponding master). Otherwise the workflow may fail or return unexpected results.
#
# Pushes the raw logs, comparison table, and per-metric plots (see
# ci-perf-kit's compare_plot.py) to the ci-perf-result 'perf-compare-test'
# branch, under openjdk/pr-<N>/<plan>/<run_id>/, and posts the table and
# plots as a PR comment.

name: Binding Perf Tests

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: The pull request number to run the perf tests. The workflow compares the specified pull request with the trunk.
        required: true
      runtime:
        description: Runtime to benchmark. Only openjdk is currently supported.
        required: true
        type: choice
        default: openjdk
        options:
          - openjdk
      plan:
        description: GC plan to benchmark.
        required: true
        type: choice
        options:
          - nogc
          - semispace
          - gencopy
          - immix
          - genimmix
          - stickyimmix
          - marksweep
          - lisp2
          - ovc
          - concurrentimmix

concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    # Figure out binding PRs.
    binding-refs:
      uses: ./.github/workflows/pr-binding-refs.yml
      with:
        pull_request: ${{ github.event.inputs.pull_request }}

    # Figure out the core PR. We need to get the specific commit and repo from a pull request number.
    mmtk-refs:
      runs-on: ubuntu-22.04
      outputs:
        mmtk_repo: ${{ steps.print.outputs.mmtk_repo }}
        # NB: previously declared as 'mmtk-ref' (hyphen) while every consumer
        # read 'outputs.mmtk_ref' (underscore) - since GitHub Actions doesn't
        # normalize the two, that always resolved empty, silently falling
        # back to the branch build's default branch instead of the PR's
        # actual commit. Fixed to match the step output's name below.
        mmtk_ref: ${{ steps.print.outputs.mmtk_ref }}
      steps:
        - name: Get mmtk-core repo from pull_request
          uses: actions/github-script@v7
          id: core-repo
          with:
            result-encoding: string
            script: |
              var res = (await github.rest.pulls.get({
                owner: "mmtk",
                repo: "mmtk-core",
                pull_number: ${{ github.event.inputs.pull_request }}
              }))
              return res.data.head.repo.full_name
        - name: Get mmtk-core refs from pull_request
          uses: actions/github-script@v7
          id: core-ref
          with:
            result-encoding: string
            script: |
              var res = (await github.rest.pulls.get({
                owner: "mmtk",
                repo: "mmtk-core",
                pull_number: ${{ github.event.inputs.pull_request }}
              }))
              return res.data.head.sha
        - id: print
          run: |
            echo "mmtk_repo=${{ steps.core-repo.outputs.result }}" >> $GITHUB_OUTPUT
            echo "mmtk_ref=${{ steps.core-ref.outputs.result }}" >> $GITHUB_OUTPUT

    # Guard 'runtime', since a workflow_dispatch 'choice' input only
    # constrains the UI dropdown, not the underlying API - anyone dispatching
    # this workflow directly via the API could still pass an unsupported value.
    validate-inputs:
      runs-on: ubuntu-22.04
      steps:
        - name: Check runtime is supported
          run: |
            if [ "${{ github.event.inputs.runtime }}" != "openjdk" ]; then
              echo "Only runtime=openjdk is currently supported (got '${{ github.event.inputs.runtime }}')."
              exit 1
            fi

    # Single source of truth for CI_PERF_KIT_VERSION/heap factors, shared
    # with perf-regression-ci-openjdk.yml. We only use ci_perf_kit_version
    # and normal_heap_factor here (result_repo_branch/deploy are for the
    # production per-commit history, not this workflow - see below).
    config:
      needs: [validate-inputs]
      uses: ./.github/workflows/openjdk-perf-config.yml

    # Resolve master's current mmtk-core commit, so the trunk build's cache
    # key is a specific commit (not a moving branch name) - same reasoning
    # as mmtk-refs above, which already does this for the branch side.
    trunk-core-ref:
      runs-on: ubuntu-22.04
      outputs:
        sha: ${{ steps.sha.outputs.sha }}
      steps:
        - uses: actions/checkout@v4
          with:
            repository: mmtk/mmtk-core
            ref: master
            path: mmtk-core-trunk-ref
        - id: sha
          run: echo "sha=$(git -C mmtk-core-trunk-ref rev-parse HEAD)" >> $GITHUB_OUTPUT

    # Resolve the branch's OpenJDK 21 binding ref to a commit, for the same
    # reason. (The trunk side's binding sha comes from config's own
    # openjdk_rev output, since config already resolves mmtk/mmtk-openjdk@jdk-21 -
    # exactly the trunk's binding.)
    branch-openjdk-binding-ref:
      runs-on: ubuntu-22.04
      needs: [binding-refs]
      outputs:
        sha: ${{ steps.sha.outputs.sha }}
      steps:
        - uses: actions/checkout@v4
          with:
            repository: ${{ needs.binding-refs.outputs.openjdk21_binding_repo }}
            ref: ${{ needs.binding-refs.outputs.openjdk21_binding_ref }}
            path: mmtk-openjdk-branch-ref
        - id: sha
          run: echo "sha=$(git -C mmtk-openjdk-branch-ref rev-parse HEAD)" >> $GITHUB_OUTPUT

    # Build OpenJDK+MMTk for trunk (master + mmtk-openjdk@jdk-21) and cache
    # it (build_path=jdk-mmtk-trunk) for openjdk-run-plan below.
    openjdk-build-trunk:
      needs: [config, trunk-core-ref]
      uses: ./.github/workflows/openjdk-build-reusable.yml
      with:
        ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}
        openjdk_rev: ${{ needs.config.outputs.openjdk_rev }}
        mmtk_core_repo: mmtk/mmtk-core
        mmtk_core_ref: ${{ needs.trunk-core-ref.outputs.sha }}
        build_path: jdk-mmtk-trunk

    # Build OpenJDK+MMTk for the PR's branch and cache it
    # (build_path=jdk-mmtk-branch) for openjdk-run-plan below.
    openjdk-build-branch:
      needs: [config, binding-refs, mmtk-refs, branch-openjdk-binding-ref]
      uses: ./.github/workflows/openjdk-build-reusable.yml
      with:
        ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}
        openjdk_rev: ${{ needs.branch-openjdk-binding-ref.outputs.sha }}
        mmtk_core_repo: ${{ needs.mmtk-refs.outputs.mmtk_repo }}
        mmtk_core_ref: ${{ needs.mmtk-refs.outputs.mmtk_ref }}
        openjdk_binding_repo: ${{ needs.binding-refs.outputs.openjdk21_binding_repo }}
        openjdk_binding_ref: ${{ needs.binding-refs.outputs.openjdk21_binding_ref }}
        build_path: jdk-mmtk-branch

    # Run the one plan the caller asked for. 'plan' is restricted (via the
    # workflow_dispatch 'choice' input above) to names that map 1:1 onto an
    # existing running-openjdk-<plan>-compare.yml, so the config filename is
    # derived directly from it rather than needing a lookup table.
    openjdk-run-plan:
      needs: [config, mmtk-refs, trunk-core-ref, branch-openjdk-binding-ref, openjdk-build-trunk, openjdk-build-branch]
      uses: ./.github/workflows/openjdk-compare-run-plan-reusable.yml
      with:
        plan_name: ${{ github.event.inputs.plan }}
        config: running-openjdk-${{ github.event.inputs.plan }}-compare.yml
        # NoGC uses a fixed (max) heap rather than a multiple of min heap;
        # MarkSweep uses large_heap_factor, matching weekly-2's regression
        # run for it (every other plan uses normal_heap_factor).
        heap_modifier: ${{ github.event.inputs.plan == 'nogc' && '0' || (github.event.inputs.plan == 'marksweep' && needs.config.outputs.large_heap_factor) || needs.config.outputs.normal_heap_factor }}
        pr_number: ${{ github.event.inputs.pull_request }}
        ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}
        result_repo_branch: perf-compare-test
        trunk_mmtk_core_ref: ${{ needs.trunk-core-ref.outputs.sha }}
        trunk_openjdk_rev: ${{ needs.config.outputs.openjdk_rev }}
        branch_mmtk_core_ref: ${{ needs.mmtk-refs.outputs.mmtk_ref }}
        branch_openjdk_rev: ${{ needs.branch-openjdk-binding-ref.outputs.sha }}
      secrets: inherit
