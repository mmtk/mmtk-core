name: Performance Regression CI (OpenJDK, weekly batch 1)

# Batch 1 of the plans we don't track on every commit (see
# perf-regression-ci-openjdk.yml for those, and weekly-2 for the rest of this
# split): NoGC, SemiSpace, GenCopy, Immix, GenImmix. Runs against whichever
# OpenJDK+MMTk build was most recently cached by perf-regression-ci-openjdk.yml's
# openjdk-build job (see openjdk-run-plan-reusable.yml for the cache lookup).
on:
  # TEMPORARILY DISABLED while testing the OpenJDK Chopin workflow changes -
  # only perf-regression-ci-openjdk.yml should run on a schedule. Revert this before merging.
  # Times are in UTC; GitHub Actions cron cannot follow daylight saving, so
  # this is pinned to AEST (UTC+10, Canberra standard time): Saturday 00:00
  # AEST = Friday 14:00 UTC. During AEDT (UTC+11, roughly Oct-Apr) this will
  # actually fire at 1am AU time instead of 0am.
  # schedule:
  #   - cron: '0 14 * * 5'
  # Manual trigger, e.g. for testing without waiting for the schedule.
  workflow_dispatch:
  # See openjdk-perf-config.yml for the "testing in a branch" convention -
  # its env: block is what you toggle, not one here.
  # TESTING: enabled to validate the Chopin workflow changes alongside
  # perf-regression-ci-openjdk.yml. Revert this before merging.
  pull_request:
    branches:
      - master

jobs:
  # Single source of truth for RESULT_REPO_BRANCH/DEPLOY/CI_PERF_KIT_VERSION,
  # shared with the per-commit and other weekly-batch workflows. See
  # openjdk-perf-config.yml.
  config:
    uses: ./.github/workflows/openjdk-perf-config.yml

  # Build OpenJDK+MMTk if it isn't already cached (e.g. the per-commit
  # workflow's cache expired, or hasn't run yet) - cheap no-op otherwise,
  # since this reuses the same cache-hit-skip build job as that workflow.
  openjdk-build:
    needs: [config]
    uses: ./.github/workflows/openjdk-build-reusable.yml
    with:
      ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}

  openjdk-run-plan:
    needs: [config, openjdk-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - plan_name: nogc
            config: running-openjdk-nogc-complete.yml
            heap_modifier: "0"
          - plan_name: semispace
            config: running-openjdk-semispace-complete.yml
            heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
          - plan_name: gencopy
            config: running-openjdk-gencopy-complete.yml
            heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
          - plan_name: immix
            config: running-openjdk-immix-complete.yml
            heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
          - plan_name: genimmix
            config: running-openjdk-genimmix-complete.yml
            heap_modifier: ${{ needs.config.outputs.normal_heap_factor }}
    uses: ./.github/workflows/openjdk-run-plan-reusable.yml
    with:
      plan_name: ${{ matrix.plan_name }}
      config: ${{ matrix.config }}
      heap_modifier: ${{ matrix.heap_modifier }}
      result_repo_branch: ${{ needs.config.outputs.result_repo_branch }}
      deploy: ${{ needs.config.outputs.deploy == 'true' }}
      ci_perf_kit_version: ${{ needs.config.outputs.ci_perf_kit_version }}
      openjdk_rev: ${{ needs.config.outputs.openjdk_rev }}
    secrets: inherit
